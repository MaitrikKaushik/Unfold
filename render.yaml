services:
  - type: web
    name: unfold-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: POST_THRESHOLD
        value: 5
      - key: CLIENT_ORIGIN
        value: "*"
