services:
  - type: web
    name: unfold-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: POST_THRESHOLD
        value: 5
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DATA_DIR
        value: ""
      - key: UPLOAD_DIR
        value: ""
    # To attach persistent storage on Render (Starter plan and above):
    # disk:
    #   name: unfold-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: DATA_DIR
    #     value: /var/data
    #   - key: UPLOAD_DIR
    #     value: /var/data/uploads
