# Local development stack only. Replace all development credentials before deployment.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - unfold_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}] }).ok }'"]
      interval: 10s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unfold
      POSTGRES_USER: unfold
      POSTGRES_PASSWORD: unfold_local_dev
    ports:
      - "5432:5432"
    volumes:
      - unfold_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unfold -d unfold"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - unfold_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local_unfold_secret_change_before_deploy_2026}
      JWT_EXPIRES_IN: 7d
      COOKIE_SAME_SITE: lax
      BCRYPT_ROUNDS: 12
      MONGODB_URI: mongodb://mongo:27017/unfold?replicaSet=rs0
      DATABASE_URL: postgresql://unfold:unfold_local_dev@postgres:5432/unfold
      PG_POOL_MAX: 5
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAX_MEDIA_FILES: 5
      MAX_MEDIA_SIZE_MB: 25
      UPLOAD_DIR: /app/uploads
      DATA_DIR: /app/data
    ports:
      - "4000:4000"
    volumes:
      - unfold_legacy_data:/app/data
      - unfold_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  unfold_mongo_data:
  unfold_postgres_data:
  unfold_redis_data:
  unfold_legacy_data:
  unfold_uploads:
